# Nginx reverse-proxy for Seat Draft.
#
# The two things that matter:
#  1. The Upgrade/Connection headers — without them WebSockets fail and the
#     app silently falls back to nothing (phones join, then never update).
#  2. X-Forwarded-Proto — the QR code uses it to know it should encode https.
#
# For TLS, run `certbot --nginx` after installing this, or add your own
# ssl_certificate lines.

server {
    listen 80;
    server_name seats.example.com;   # <- your domain or server IP

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket pass-through (required)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # So the app knows who and where it is
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Idle WebSockets stay open through the whole game
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
